# Refresh the farm snapshots once a day. Commits to main only when the data
# changed, so a quiet offseason day costs no deploy. Either script failing
# fails the job and leaves the last good files in place (docs/adr/0003).
name: nightly-data
on:
  schedule:
    - cron: '41 10 * * *' # 10:41 UTC = 5:41 AM Central (CDT)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nightly-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/data/gen-org.mjs
      - run: node scripts/data/fetch-pipeline.mjs
      # Fills only archive seasons that are missing, so most nights it makes
      # no requests beyond reading the files on disk.
      - run: node scripts/data/gen-archive.mjs
      - run: node scripts/data/gen-prospect-history.mjs
      - run: npm test
      - name: Commit if changed
        run: |
          # generatedAt changes every run; commit only when real data changed.
          if ! node scripts/data/changed.mjs; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          git commit -m "data: nightly farm snapshot"
          git push
