# Refresh the farm snapshots once a day. Commits to main only when the data
# changed, so a quiet offseason day costs no deploy.
#
# Each generator runs on its own: one failing source (say, the Pipeline
# scrape) does not throw away another's good data. A failed generator leaves
# its last good file in place (docs/adr/0003), and the job still fails at the
# end so the failure is seen. Nothing is committed unless the site builds.
name: nightly-data
on:
  schedule:
    - cron: '41 10 * * *' # 10:41 UTC = 5:41 AM Central (CDT)
  workflow_dispatch:
# contents: write for a manual run on a branch; actions: write for the
# keepalive step. Pushes to main go through the deploy key below.
permissions:
  contents: write
  actions: write
concurrency:
  group: nightly-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      # main only changes through a PR (the repo's ruleset). This deploy key is
      # the one actor the ruleset lets push to main, so the job checks out and
      # pushes with it. Its private half is the NIGHTLY_DEPLOY_KEY secret.
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.NIGHTLY_DEPLOY_KEY }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: org
        continue-on-error: true
        run: node scripts/data/gen-org.mjs
      - id: pipeline
        continue-on-error: true
        run: node scripts/data/fetch-pipeline.mjs
      # Fills only archive seasons that are missing, so most nights it makes
      # no requests beyond reading the files on disk.
      - id: archive
        continue-on-error: true
        run: node scripts/data/gen-archive.mjs
      # Runs after gen-org and gen-archive: it reads the archive. Fetches only
      # past players with no entry, unless gen-org moved to a new season.
      - id: careers
        continue-on-error: true
        run: node scripts/data/gen-careers.mjs
      - id: history
        continue-on-error: true
        run: node scripts/data/gen-prospect-history.mjs
      # Runs after gen-org and gen-archive: it reads their player lists.
      - id: mlb
        continue-on-error: true
        run: node scripts/data/gen-mlb.mjs
      # Runs after gen-org: it reads the season and the player ids from org.json.
      - id: gamelog
        continue-on-error: true
        run: node scripts/data/live/gen-gamelog.mjs
      # The new data must pass the tests and build the site before it reaches
      # main. The push does start ci.yml, but Vercel deploys at the same time,
      # so this is the check that counts.
      - run: npm test
      - run: npm run build
      - name: Commit if changed
        run: |
          # generatedAt changes every run; commit only when real data changed.
          if ! node scripts/data/changed.mjs; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          git commit -m "data: nightly farm snapshot"
          # A merge can land on the branch while the job runs. Rebase onto it
          # and retry rather than lose the night's data. The branch is the one
          # the job ran on: main on schedule, any branch on a manual run.
          for attempt in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 15))
          done
          exit 1
      # GitHub turns off a public repo's schedule after 60 days with no
      # activity, and a quiet offseason commits nothing. Enabling the workflow
      # through the API counts as activity (the keepalive-workflow action's
      # API mode does the same).
      - name: Keepalive
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable nightly-data.yml --repo "$GITHUB_REPOSITORY"
      # CLAUDE.md rule 2 with a script behind it: every captured fixture's
      # field paths must still be in a fresh API response.
      - id: drift
        continue-on-error: true
        run: node scripts/data/drift.mjs
      # A job can succeed every night and write nothing (gen-org keeping last
      # season). This fails when the snapshots are stuck.
      - run: node scripts/data/freshness.mjs
      - name: Fail if a generator or the drift check failed
        if: always()
        env:
          RESULTS: >-
            gen-org=${{ steps.org.outcome }}
            fetch-pipeline=${{ steps.pipeline.outcome }}
            gen-archive=${{ steps.archive.outcome }}
            gen-careers=${{ steps.careers.outcome }}
            gen-prospect-history=${{ steps.history.outcome }}
            gen-mlb=${{ steps.mlb.outcome }}
            gen-gamelog=${{ steps.gamelog.outcome }}
            api-drift=${{ steps.drift.outcome }}
        run: |
          failed=$(echo "$RESULTS" | tr ' ' '\n' | grep -v '=success$' || true)
          if [ -n "$failed" ]; then
            echo "These steps failed (a failed generator kept its last good file):"
            echo "$failed"
            exit 1
          fi
