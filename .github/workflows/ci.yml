name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lint-test-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The post path check (ADR-0009) compares this branch with main.
      - run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Smoke tests over the build (roadmap Phase 1): routes, links, axe.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # The SEO pack changes with SITE_URL: check it set as well as unset
      # (the run above). Roadmap Phase 1, item 1.
      - run: SITE_URL=https://example.test npm run build
      - run: SITE_URL=https://example.test npx playwright test e2e/seo.spec.js
